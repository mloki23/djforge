[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-midi-io.workspace = true
soundcraft-dsp.workspace = true
log.workspace = true
rtrb.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[features]
# The hand-driven audio thread end-to-end tests use (`harness`); not for the app.
harness = ["soundcraft-midi-io/testing"]
# ASIO on Windows (cpal's ASIO host). Off by default: building it downloads Steinberg's ASIO SDK
# (its own licence) and needs LLVM (libclang) for the bindings. `cargo build -p soundcraft --features asio`.
asio = ["cpal/asio"]

[dev-dependencies]
serde_json.workspace = true
soundcraft-engine.workspace = true
soundcraft-playback = { path = ".", features = ["harness"] }
soundcraft-midi.workspace = true
soundcraft-midi-io = { workspace = true, features = ["testing"] }

[lints]
workspace = true
